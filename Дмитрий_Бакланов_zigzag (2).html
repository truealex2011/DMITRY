<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Дмитрий Анатольевич Бакланов</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F4;--ink:#111;--mut:#555;--y:#FFE81A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;align-items:center;gap:36px;padding:20px 36px;background:linear-gradient(var(--bg) 65%,transparent)}
.logo{font:900 20px Arial,sans-serif}
nav{display:flex;gap:24px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
nav a{cursor:pointer;padding-bottom:3px}nav a.on{box-shadow:inset 0 -4px var(--y)}
.prog{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600}
.bar{width:min(24vw,320px);height:2px;background:#ccc;position:relative}
.bar i{position:absolute;left:0;top:0;height:2px;background:var(--y);width:0;box-shadow:0 0 0 1px var(--y)}
.stick{position:sticky;top:0;height:100vh;overflow:hidden}
#track{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}
#path-svg{position:absolute;top:0;left:0;pointer-events:none;z-index:1;overflow:visible}
.p{position:absolute;box-sizing:border-box;width:var(--card-w,500px);max-height:calc(100vh - 150px);padding:36px 32px 28px;background:#fff;border:2px solid var(--ink);border-top:6px solid var(--y);box-shadow:8px 8px 0 rgba(17,17,17,.12);border-radius:6px;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;z-index:2;transition:box-shadow .3s,border-color .3s}
.p:hover{box-shadow:12px 12px 0 var(--ink)}
.p.facts{background:var(--y);border-top:6px solid var(--ink)}
.p>*{opacity:0;transform:translateY(20px);transition:opacity .6s ease-out,transform .6s ease-out}
.p.in>*{opacity:1;transform:none}.p.in>:nth-child(2){transition-delay:.08s}.p.in>:nth-child(3){transition-delay:.16s}.p.in>:nth-child(4){transition-delay:.24s}.p.in>:nth-child(5){transition-delay:.32s}
.n{position:absolute!important;top:14px;left:18px;font-size:11px;font-weight:800;background:var(--y);color:var(--ink);padding:2px 8px;border:1.5px solid var(--ink);border-radius:3px;box-shadow:2px 2px 0 var(--ink)}
.facts .n{background:var(--ink);color:var(--y);border-color:var(--ink)}
h2{margin:14px 0 10px;font:900 clamp(24px,2.6vw,38px)/1.08 Arial,sans-serif;text-transform:uppercase}
.hand{align-self:flex-start;font:400 clamp(18px,1.9vw,28px)/1.1 Georgia,serif;margin:4px 0 14px;padding:2px 8px;background:linear-gradient(transparent 50%,var(--y) 50%)}
.p.in .hand{transform:rotate(-3deg)}.facts .hand{background:none}
p{margin:0 0 12px;max-width:46ch;color:var(--mut);font-size:15px;line-height:1.55}
p a{color:var(--ink);box-shadow:inset 0 -3px var(--y);font-weight:600;text-decoration:none;white-space:nowrap}
.facts p a{box-shadow:inset 0 -3px var(--ink)}
.quote{margin:4px 0 14px;max-width:46ch;padding:14px 16px;border-left:6px solid var(--y);background:#f9f9f7;color:var(--ink);font:500 16px/1.45 Arial,sans-serif}
.facts .quote{background:#fff}
.qby{margin:-8px 0 14px;padding-left:22px;color:var(--mut);font:400 20px/1 Georgia,serif}
.list{margin:0 0 14px;padding-left:18px;max-width:46ch;color:var(--mut);font-size:14px}.list li{padding:3px 0}
.links{display:grid;gap:6px;max-width:46ch;margin-top:4px}.links a{width:max-content}
table{border-collapse:collapse;font-size:13px;width:100%;margin-top:6px}
td{padding:8px 12px 8px 0;border-top:1px solid #e2e2de;vertical-align:top}td:first-child{font-size:11px;font-weight:700;text-transform:uppercase;width:120px;color:var(--ink)}
.frame{width:100%;max-width:440px;aspect-ratio:4/3;margin-bottom:18px;background:#e9e9e6;border:6px solid var(--y);box-shadow:8px 8px 0 var(--y);display:flex;align-items:center;justify-content:center;font:800 13px Montserrat,Arial,sans-serif;text-transform:uppercase}
.f{display:flex;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid rgba(0,0,0,.15)}
.f b{font:900 40px/1 Montserrat,Arial,sans-serif;min-width:130px}.f span{font-size:13px}
.mq{overflow:hidden;white-space:nowrap;background:var(--ink);color:var(--y);padding:16px 0;font:900 18px Montserrat,Arial,sans-serif;letter-spacing:.2em}
.mq div{display:inline-block;animation:mq 40s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}

#words{position:absolute;inset:0;z-index:1;pointer-events:none}
.w{position:absolute;left:50%;top:50%;font:900 clamp(44px,11vw,170px)/1 Arial,sans-serif;text-transform:uppercase;white-space:nowrap;text-align:center;opacity:0;will-change:transform,opacity}
#iblob{--b:min(62vw,80vh);position:absolute;left:calc(50% - var(--b)/2);top:calc(50% - var(--b)/2);width:var(--b);height:var(--b);border-radius:50%;background:var(--y);will-change:transform}
.sup{position:absolute;z-index:3;font:700 12px/1.4 Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;max-width:260px;margin:0;color:var(--ink)}
.s4{left:36px;top:100px}.s2{right:36px;top:100px}.s1,.s3{display:none}
.hint{position:absolute;z-index:3;left:50%;bottom:28px;transform:translateX(-50%);font:700 12px Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em}



.p.cover{padding:0;overflow:hidden;border:0;background:var(--bg);display:block;box-shadow:none}
.p.cover:hover{box-shadow:none}.p.cover .n{display:none}
.cv{position:relative;width:100%;height:100%;opacity:1}.p.cover>.cv{transform:none}
.cv-ph{position:absolute;z-index:1;right:0;bottom:0;width:68%;cursor:pointer;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 30%,#000 88%,transparent 100%),linear-gradient(to top,transparent 0,#000 10%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 30%,#000 88%,transparent 100%),linear-gradient(to top,transparent 0,#000 10%);mask-composite:intersect}
.cv-ph img{display:block;width:100%;height:auto}
.cv-ph .c{position:absolute;left:0;top:0;opacity:0;transition:opacity .5s ease}
.cv-ph:hover .c,.cv-ph.on .c{opacity:1}
.cv-nav{position:absolute;z-index:3;left:4%;top:6%;width:46%;display:flex;flex-wrap:wrap;gap:8px 18px;font:600 11px/1.3 Arial,sans-serif;text-transform:uppercase;letter-spacing:.05em}
.cv-nav a{cursor:pointer;padding-bottom:2px}.cv-nav a:hover{box-shadow:inset 0 -4px var(--y)}
.cv-h{position:absolute;z-index:3;left:4%;top:14%;margin:0;font:900 9.6vh/.98 Arial,sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.p.cover .cv-t{position:absolute;z-index:3;left:4%;top:60%;width:38%;max-width:none;margin:0;font-size:15px;line-height:1.5;color:#444}.cv-t b{color:#111}
.cv-btn{position:absolute;z-index:3;left:4%;top:83%;cursor:pointer;border:1px solid #111;padding:10px 18px 11px;font:600 11px Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;background:#fff}
.cv-btn:hover{background:var(--y)}
.cv-sc{position:absolute;z-index:3;left:41%;top:46%;font:400 8.8vh/.95 'Marck Script','Segoe Script','Bradley Hand',cursive;rotate:-8deg;pointer-events:none;color:var(--y);text-shadow:2px 2px 0 #111,-1px -1px 0 #111,1px -1px 0 #111,-1px 1px 0 #111}
.cv-sc span{display:block}.cv-sc .w2{color:#fff;margin-left:.7em}.cv-sc .w3{margin-left:.2em}
.cv-hint{position:absolute;z-index:3;right:3%;bottom:4%;font:600 10px Arial,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none}
#path-svg{display:block}
@media(min-width:801px){
.p{padding:56px 64px 40px}
.p p{max-width:78ch;font-size:19px;line-height:1.6}
.quote{max-width:78ch;font-size:22px}.list{max-width:78ch;font-size:18px}
h2{font-size:clamp(32px,4vw,60px);margin-top:22px}
.hand{font-size:clamp(22px,2.4vw,34px)}
table{font-size:16px;max-width:820px}td:first-child{font-size:12px;width:190px}
.n{top:22px;left:28px;font-size:13px}
.f b{font-size:56px;min-width:180px}.f span{font-size:16px}
}
@media(max-width:800px){
.s3{display:none}.s1{left:22px;bottom:90px;max-width:70vw}.s4{left:22px;top:80px}.s2{right:22px;top:80px}
.p.cover{padding:0!important;height:auto}
.cv{height:auto;padding:60px 0 36px}
.cv-ph{position:relative;width:100%;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 8%,#000 92%,transparent 100%),linear-gradient(to top,transparent 0,#000 12%);mask-image:linear-gradient(to right,transparent 0,#000 8%,#000 92%,transparent 100%),linear-gradient(to top,transparent 0,#000 12%)}
.cv-sc{left:5%;top:calc(60px + 34vw);font-size:10.5vw}
.cv-nav{position:static;width:auto;padding:14px 22px 0}
.cv-h{position:static;padding:18px 22px 0;font-size:10.4vw}
.p.cover .cv-t{position:static;width:auto;padding:0 22px;margin:14px 0}
.cv-btn{position:static;display:inline-block;margin:0 22px}.cv-hint{display:none}
#track{position:static}
.s4{display:none}#iblob{--b:84vw;top:calc(50% - var(--b)/2)}.w{font-size:15vw}
header{padding:14px 18px}nav,.prog{display:none}
#tl .stick{position:static;height:auto;overflow:visible}
#track{display:block;position:static;width:100%!important;height:auto!important;transform:none!important}
#path-svg{display:none}
.p,.p.facts{position:static;width:100%!important;height:auto;min-height:auto;max-height:none;padding:80px 22px 40px;margin-bottom:24px;border-right:0;border-bottom:2px solid var(--ink);transform:none!important}
.n{left:22px;top:22px}
}
@media(prefers-reduced-motion:reduce){.p>*{opacity:1;transform:none;transition:none}.mq div{animation:none}}
</style>
</head>

{a:'Детство',h:'Черёмушки',hand:'1978–1996',p:'Дмитрий родился 2 ноября 1978 года в посёлке Черёмушки в Хакасии, рядом с Саяно-Шушенской ГЭС. Его родители, Анатолий Бакланов 1952 года рождения и Надежда Бакланова 1953 года рождения, приехали строить и запускать станцию и именно здесь познакомились. Анатолий работал электриком на ГЭС, Надежда — пожарным в МЧС. Вокруг были тайга, горы и Енисей, поэтому детство прошло на природе.',rows:[['Место','Черёмушки, Хакасия'],['Родители','Анатолий и Надежда Баклановы'],['Отец','электрик на ГЭС'],['Мама','пожарный в МЧС']]},
{h:'Детство и юность',hand:'человек слова',p:'Дмитрий рос рядом с дядей, помогал ему и именно у него научился разбираться в машинах. Ещё он работал в дядином бизнесе — был диджеем в клубе. Много времени проводил на рыбалке, ловил окуня в заливе на Енисее, а с отцом ходил на охоту.',rows:[['Охота','с отцом Анатолием'],['Рыбалка','окунь в заливе Енисея'],['Походы','озёра, поездки купаться'],['Школа','№ 2, выпуск 1996']]},
{h:'Истории Черёмушек',hand:'Чёрная жемчужина',p:'Анатолий в молодости часто охотился. В семье помнят историю, как он далеко от дома подстрелил медведя и несколько километров тащил его с горы. Он был человеком слова: если что-то обещал, всегда выполнял. Один из приятелей Дмитрия собрал большой корабль «Чёрная жемчужина», а потом открыл парк развлечений «Тортуга». Корабль везли катером на понтонах; во время сплава мачта зацепилась за ЛЭП, и её пришлось спиливать.',rows:[['Корабль','«Чёрная жемчужина»'],['Парк','«Тортуга»'],['Семейная черта','сказал — сделал']]},
{h:'Красноярск',hand:'после 1996',p:'После школы Дмитрий уехал в Красноярск — большой город на Енисее. Он выбрал механику и стал изучать автомобили, тракторы и лесные машины. Учился заочно на механическом факультете СибГТУ.',rows:[['Город','Красноярск'],['Учёба','механический факультет СибГТУ'],['Интерес','автомобили, тракторы, лесные машины']]},
{h:'Япония',hand:'Дима-сан',p:'В 2003, 2004 и 2005 годах Дмитрий три раза по три месяца жил в Японии — всего девять месяцев. Он гонял машины, делал мелкий ремонт, работал с японскими партнёрами и на Вячеслава Клименкова, а ещё перепродавал автомобили. Там он выучил японский и получил своё японское имя: Дима-сан.',rows:[['Срок','3 поездки по 3 месяца'],['Итого','9 месяцев'],['Работа','перегон, ремонт, перепродажа авто'],['Семья','научил Алексея считать по-японски до десяти']]},
{h:'Сакура Моторс',hand:'с 2006 года',p:'В 2006 году Дмитрий пришёл в красноярский автосервис «Сакура Моторс», потому что любит машины и хорошо в них разбирается. До 2010 года он был старшим менеджером, потом мастером. К 2026 году занимает должность заместителя директора по хозяйственной части.',rows:[['2006–2010','старший менеджер'],['После 2010','мастер'],['2026','заместитель директора по хозяйственной части']]},
{h:'Жил не тужил',hand:'2008–2009',p:'В 2008 году Дмитрий закончил СибГТУ. Учёба закончена, Япония позади, и он живёт, как говорится, не тужил.',rows:[['Диплом','СибГТУ, 2008'],['Дальше','работа, семья и новые истории']]},
{h:'Встреча',hand:'25 сентября 2009',p:'В ресторане Дмитрий сидел с двоюродным братом Эдуардом и родственниками Пятовыми. Неподалёку танцевали две подруги, и одна из них, Наталья, сразу заметила Дмитрия. Он ей понравился с первого взгляда, она станцевала рядом с ним, а Дмитрий пригласил её на танец.',rows:[['Познакомились','25.09.2009'],['Сказала Наталья','«И больше мы не расставались»'],['Шутка Дмитрия','она сама пошла на него танцем']]},
{h:'Предложение и свадьба',hand:'16 октября 2010',p:'Через год после знакомства Дмитрий решил сделать главный шаг. Наталья ждала этого целый год и намекала, как могла. Они поехали гулять на набережную и взяли в аренду катамаран. Дмитрий сказал: «Смотри, как красиво вокруг, смотри, какие уточки!» Наталья пошутила: «Давай её веслом и в суп», и этим перебила романтику. Тогда Дмитрий попросил закрыть глаза. Когда она открыла их, он стоял на одном колене и протягивал коробочку. Потом они взяли шампанское и поехали отмечать к родным, к семье Грохотовых.',rows:[['Знакомство','25.09.2009'],['Свадьба','16.10.2010'],['Место праздника','семья Грохотовых']]},
{h:'Старший сын',hand:'2011 · Алексей',p:'За несколько дней до рождения сына в Красноярск переехали родители Натальи — Пётр и Надежда Грохотовы. В 2011 году родился Алексей, и Дмитрию было 32. Родные переживали за фамилию Бакланов: у двоюродного брата Эдуарда, которого все зовут дядя Бэн, родились две дочки — Диана и Камилла. С Эдуардом Дмитрий был близким другом с детства, и вместе они хулиганили.',rows:[['Алексей','голубоглазый и высокий'],['Дядя Бэн','Эдуард Бакланов'],['Кузины','Диана и Камилла']]},
{h:'Баба Надя',hand:'«Нет, это будет Алексей!»',p:'На фотографиях тех лет Дмитрий сияет от счастья. Баба Надя была доброй, образованной и очень начитанной. Когда родители предлагали назвать внука Максимом, она твёрдо сказала: «Нет, это будет Алексей!» Она читала внуку книги и дарила игрушки. Дмитрий работал на трёх работах, чтобы Алексей попал в хороший садик, и всё равно находил время заниматься с сыном.',q:'Сильно добрый порой.',by:'Наталья — о Дмитрии как об отце'},
{h:'Лада Гранта',hand:'2012',p:'В 2012 году Дмитрий купил чёрную Ладу Гранту.',rows:[['Автомобиль','Лада Гранта'],['Цвет','чёрный']]},
{h:'Младший сын',hand:'2014 · Артём',p:'В 2014 году родился Артём. Алексей похож на Дмитрия: голубоглазый и высокий. Артём — копия мамы: кареглазый и тоже высокий.',rows:[['Алексей','похож на Дмитрия'],['Артём','копия Натальи'],['Оба','высокие']]},
{h:'Золотой человек',hand:'2016–2018',p:'Клиенты «Сакуры» не раз благодарили Дмитрия за помощь, консультации и советы. Эти отзывы показывают, почему его называют золотым человеком.',links:[['Отзыв 2016 года','https://krasnoyarsk.flamp.ru/firm/sakura_motors_avtotekhcentr-985690699824442/otzyv-2377545'],['Отзыв 2017 года','https://krasnoyarsk.flamp.ru/firm/sakura_motors_avtotekhcentr-985690699824442/otzyv-3481003'],['Отзыв 2018 года','https://krasnoyarsk.flamp.ru/firm/sakura_motors_avtotekhcentr-985690699824442/otzyv-3816518']]},
{h:'Тойота Харриер',hand:'около 2020',p:'Около 2020 года Дмитрий купил белую Тойоту Харриер.',rows:[['Автомобиль','Тойота Харриер'],['Цвет','белый']]},
{h:'Первый рябчик',hand:'2024',p:'В 2024 году Алексей подстрелил своего первого рябчика, а учил его Дмитрий. Охотиться с сыном на уток, рябчиков и глухарей он ходил и раньше. С друзьями Женей и Возгеном ходит на косулю и другую дичь.',rows:[['Сын и отец','охота вместе'],['Дичь','утки, рябчики, глухари, косуля'],['Роль Дмитрия','учит и сопровождает']]},
{h:'Двадцать лет в «Сакуре»',hand:'2026',p:'К 2026 году Дмитрий работает в «Сакуре» уже 20 лет и отвечает за хозяйственную часть: здание, ремонт, закупки и многое другое. С директором у него близкие отношения.',rows:[['Стаж','20 лет в «Сакуре»'],['Должность','заместитель директора по хозяйственной части'],['Отвечает за','здание, ремонт, закупки']]},
{h:'Лодка и рыбалка',hand:'серо-оранжевая',p:'В 2026 году Дмитрий купил серо-оранжевую моторную лодку с мотором около 18 лошадиных сил. Вместе со старшим сыном Алексеем уже выходил на ней на Енисей. Для лодки он сам сшил карманы и чехлы. Рекордные рыбы у Дмитрия были больше килограмма. Он плетёт мушки на хариуса из ниток и крючков — приманку, похожую на насекомое. В последние годы делает это реже, но руки помнят.',rows:[['Мотор','около 18 л.с.'],['Лодка','сшитые своими руками карманы и чехлы'],['Рыбалка','хариус и рыбы больше килограмма']]},
{h:'Золотые руки',hand:'починит почти всё',p:'Дмитрий может починить почти всё. В 2026 году он починил сломавшийся зонтик. Он паяет, варит, шьёт и отлично готовит.',rows:[['Умеет','паять, варить, шить'],['Ещё','отлично готовит'],['Принцип','руки растут откуда нужно']]},
{h:'Дача и семья',hand:'работает за десятерых',p:'Каждый год Дмитрий с семьёй ездит в Хакасию и работает на даче. Почти каждую неделю они приезжают на дачу к родителям жены, Петру и Надежде Грохотовым, где он всё чинит и работает за десятерых. По выходным семья старается куда-нибудь выбраться. К 2026 году Анатолий, отец Дмитрия, ухаживает за двумя дачами и выращивает самые вкусные помидоры и огурцы.',rows:[['Каждый год','Хакасия и дача'],['Почти каждую неделю','дача Грохотовых'],['Анатолий','две дачи, помидоры и огурцы']]},
{h:'Характер',hand:'человек-праздник',p:'Дмитрий — самый оптимистичный и весёлый человек. На любое слово у него найдётся шутка, и он всегда поддержит добрым словом. У него большой словарный запас, он знает множество песен и может запеть просто так, без повода. С ним любая компания оживает. Он легко подходит к незнакомым людям, а завидев рыбака, быстро находит с ним общий язык — и они уже спорят, как правильно привязывать мушку.',rows:[['Раньше','был диджеем'],['Рингтон','AC/DC — «Thunderstruck»'],['Главное','шутка, песня и доброе слово']]},
{h:'Что говорит любимая',hand:'Наталья',q:'У меня самый прекрасный муж на свете, которого я безумно люблю, и с каждым годом всё сильнее и сильнее. С каждым годом он всё роднее и роднее. Он очень внимательный: стоит сказать, что я чего-то хотела бы, и он сделает или купит, если это в его силах. Он щедрый, ему на меня ничего не жалко. Он с чувством юмора, может всё что угодно починить, руки растут откуда нужно. Он очень красивый, статный, высокий, и главное, он любит меня, я это чувствую.',by:'Любимая Наталья'},
{h:'Что желает любимая',hand:'на всю жизнь',q:'Главное, чтобы жил долго и был здоровым. Остальное у него есть, а если чего-то нет, заработаем и купим.',by:'Любимая Наталья'},
{h:'Мечты',hand:'простые и добрые',p:'Мечты у Дмитрия простые и добрые.',list:['Чтобы родители жили как можно дольше.','Чтобы у детей всё было хорошо.','Чтобы в семье всё было стабильно.','Чтобы в стране был мир.']},
{k:'facts',a:'Итоги',h:'Факты<br>о нём',hand:'Всё это он',p:'Три поездки в Японию. 20 лет в «Сакуре». Двое сыновей. В браке с 2010 года.',f:[[3,'поездки в Японию'],[20,'лет в «Сакуре»'],[2,'сына'],['D','дней вместе с 16.10.2010']]},
{k:'facts',h:'Однофамильцы',hand:'и только один',p:'Дмитриев Баклановых в России хватает. Один бегает на лыжах, другой пишет приложения, третий руководит предприятием, четвёртый занимается клинингом. И только один из них родился в Черёмушках, три раза жил в Японии, был диджеем и может починить что угодно.'}
];
const track=$('track'),nav=$('nav'),tl=$('tl'),intro=$('intro');
P.forEach((s,i)=>{
const e=document.createElement('section');e.className='p '+(s.k||'');
if(s.html){e.innerHTML=s.html;track.appendChild(e);if(s.a){const a=document.createElement('a');a.textContent=s.a;a.dataset.i=i;a.onclick=()=>go(e);nav.appendChild(a)}return}
let c='<div class="n">'+String(i+1).padStart(2,'0')+'</div>';
if(s.ph)c+='<div class="frame">'+s.ph+'</div>';
c+='<h2>'+s.h+'</h2><div class="hand">'+s.hand+'</div>';
if(s.p)c+='<p>'+s.p+'</p>';
if(s.q)c+='<blockquote class="quote">'+s.q+'</blockquote>';
if(s.by)c+='<div class="qby">— '+s.by+'</div>';
if(s.list)c+='<ul class="list">'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
if(s.links)c+='<div class="links">'+s.links.map(x=>'<a href="'+x[1]+'" target="_blank" rel="noopener">'+x[0]+' ↗</a>').join('')+'</div>';
if(s.rows)c+='<table>'+s.rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join('')+'</table>';
if(s.f)c+=s.f.map(x=>'<div class="f"><b data-to="'+(x[0]==='D'?Math.floor((Date.now()-Date.UTC(2010,9,16))/864e5):x[0])+'">0</b><span>'+x[1]+'</span></div>').join('');
e.innerHTML=c;track.appendChild(e);
if(s.a){const a=document.createElement('a');a.textContent=s.a;a.dataset.i=i;a.onclick=()=>go(e);nav.appendChild(a)}
});
const secs=[...track.children],links=[...nav.children];
document.querySelectorAll('[data-h]').forEach(el=>el.onclick=()=>{const k=P.findIndex(x=>x.h===el.dataset.h);if(k>=0)go(secs[k])});
document.querySelectorAll('[data-next]').forEach(el=>el.onclick=()=>go(secs[1]));
$('cvph').onclick=function(){this.classList.toggle('on')};
$('tot').textContent=String(secs.length).padStart(2,'0');
$('mq').textContent=('ЖИЛ НЕ ТУЖИЛ · ДИМА-САН · ЧЁРНАЯ ЖЕМЧУЖИНА · THUNDERSTRUCK · ЗОЛОТЫЕ РУКИ · ').repeat(8);
const D=()=>innerWidth>800;
const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg'),path=document.createElementNS(NS,'path');
svg.id='path-svg';svg.setAttribute('width','1');svg.setAttribute('height','1');
path.setAttribute('fill','none');path.setAttribute('stroke','#FFE81A');path.setAttribute('stroke-width','6');path.setAttribute('stroke-dasharray','2 16');path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');
svg.appendChild(path);track.insertBefore(svg,track.firstChild);
const COLS=4;let pts=[],cum=[0],L=1;
function layout(){
if(!D()){track.style.cssText='';secs.forEach(e=>e.style.cssText='');pts=[];return}
const iw=innerWidth,ih=innerHeight;
const cw=Math.round(Math.min(iw-120,1240)),gap=90,H=ih-150;
track.style.setProperty('--card-w',cw+'px');
secs.forEach(e=>e.style.cssText='height:'+H+'px');
const hs=secs.map(e=>e.offsetHeight),rows=Math.ceil(secs.length/COLS);
const rowH=H+130;
pts=[];cum=[0];
secs.forEach((e,i)=>{
const r=Math.floor(i/COLS),c=i%COLS,col=r%2===0?c:COLS-1-c;
const wave=(c%2)*60,cy=r*rowH+wave,x=col*(cw+gap);
e.style.left=x+'px';e.style.top=(cy-hs[i]/2)+'px';
pts.push({x:x+cw/2,y:cy});
if(i)cum.push(cum[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y))});
L=Math.max(1,cum[cum.length-1]);
path.setAttribute('d','M'+pts.map(p=>p.x+' '+p.y).join(' L'));
tl.style.height=(L+ih)+'px'}
function camAt(d){let i=1;while(i<pts.length-1&&cum[i]<d)i++;
const a=pts[i-1],b=pts[i],k=cl((d-cum[i-1])/Math.max(1,cum[i]-cum[i-1]));
return{x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k}}
function size(){layout();if(!D())tl.style.height='auto';intro.style.height=RM?'100vh':(D()?380:300)+'vh'}
function go(e){const i=secs.indexOf(e);if(D())scrollTo({top:tl.offsetTop+cum[i]/L*(tl.offsetHeight-innerHeight),behavior:'smooth'});else e.scrollIntoView({behavior:'smooth'})}
function count(b){const to=+b.dataset.to,t0=performance.now();(function s(t){const k=cl((t-t0)/1400);b.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(s)})(t0)}
function frame(){
const y=scrollY,ih=intro.offsetHeight-innerHeight,p=ih>0?cl(y/ih):1,n=wel.length;
wel.forEach((el,i)=>{const t=p*n-i;let o,s;
if(RM){o=i===0?1:0;s=1}else if(i===0){o=t<.55?1:Math.max(0,1-(t-.55)/.45);s=1+.5*cl(t)}else if(i===n-1){o=t<0?0:cl(t*3);s=.8+.2*cl(t*2)}else{o=t<0||t>1?0:Math.pow(Math.sin(Math.PI*t),.5);s=.7+.5*cl(t)}
el.style.opacity=o;el.style.transform='translate(-50%,-50%) scale('+s+')'});
document.querySelectorAll('.sup').forEach(e=>e.style.opacity=RM?1:1-cl(p*6));
$('iblob').style.transform='scale('+(.75+.35*p)+')';
const tp=cl((y-tl.offsetTop)/Math.max(1,tl.offsetHeight-innerHeight));
if(D()&&pts.length){const c=camAt(tp*L);track.style.transform='translate3d('+(innerWidth/2-c.x)+'px,'+(innerHeight/2+30-c.y)+'px,0)'}
$('fill').style.width=(tp*100)+'%';
let idx=0;
if(D()&&pts.length){const d=tp*L;let best=1e9;cum.forEach((v,i)=>{const dd=Math.abs(v-d);if(dd<best){best=dd;idx=i}})}
secs.forEach((s,i)=>{const r=s.getBoundingClientRect();
if(!D()&&r.top<innerHeight*.35)idx=i;
const vis=D()?(r.left<innerWidth*.92&&r.right>0&&r.top<innerHeight*.95&&r.bottom>0):r.top<innerHeight*.85;
if(vis&&!s.classList.contains('in')){s.classList.add('in');s.querySelectorAll('[data-to]').forEach(count)}});
$('cur').textContent=String(idx+1).padStart(2,'0');
links.forEach((a,k)=>a.classList.toggle('on',+a.dataset.i<=idx&&(!links[k+1]||+links[k+1].dataset.i>idx)))
}
let tk=0;const loop=()=>{if(!tk){tk=1;requestAnimationFrame(()=>{tk=0;frame()})}};
addEventListener('scroll',loop,{passive:true});addEventListener('resize',()=>{size();loop()});
addEventListener('load',()=>{size();loop()});
size();frame();
</script>
